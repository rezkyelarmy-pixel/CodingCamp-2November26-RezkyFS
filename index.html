<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app">
        <header class="app__header">
            <h1>Task Manager</h1>
            <p class="app__subtitle">Stay organized, one task at a time.</p>
        </header>

        <form id="task-form" class="task-form" autocomplete="off">
            <input
                type="text"
                id="task-input"
                class="task-form__input"
                placeholder="What needs to be done?"
                maxlength="200"
                aria-label="Add a new task"
                required
            >
            <button type="submit" class="task-form__btn" aria-label="Add task">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </form>

        <div class="filters" role="tablist" aria-label="Filter tasks">
            <button class="filters__btn is-active" data-filter="all" role="tab" aria-selected="true">All</button>
            <button class="filters__btn" data-filter="active" role="tab" aria-selected="false">Active</button>
            <button class="filters__btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        </div>

        <ul id="task-list" class="task-list" aria-live="polite"></ul>

        <div id="empty-state" class="empty-state" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 11l3 3L22 4"></path>
                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
            </svg>
            <p id="empty-state-text">No tasks yet. Add one above!</p>
        </div>

        <footer class="app__footer">
            <span id="task-count" class="task-count">0 tasks</span>
            <button id="clear-completed" class="clear-btn" hidden>Clear completed</button>
        </footer>
    </main>

    <template id="task-template">
        <li class="task-item" role="listitem">
            <label class="task-item__check">
                <input type="checkbox" class="task-item__checkbox">
                <span class="task-item__checkmark" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </span>
            </label>
            <span class="task-item__text"></span>
            <input type="text" class="task-item__edit-input" maxlength="200" hidden>
            <button class="task-item__delete" aria-label="Delete task">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </li>
    </template>

    <script src="script.js"></script>
</body>
</html>

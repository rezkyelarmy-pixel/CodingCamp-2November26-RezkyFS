<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="dashboard">

    <!-- Greeting Section -->
    <header class="greeting">
      <h1 id="greeting-text">Hello</h1>
      <!-- Custom name: click the name chip to edit it -->
      <p class="name-row">
        <span id="name-display" class="name-display" title="Click to change your name" role="button" tabindex="0" aria-label="Your name, click to edit"></span>
        <button id="name-edit-btn" class="icon-btn name-edit-icon" type="button" title="Edit name" aria-label="Edit name">✎</button>
      </p>
      <p id="current-time" class="time"></p>
      <p id="current-date" class="date"></p>
    </header>

    <div class="grid">

      <!-- Focus Timer Section -->
      <section class="card timer-card" aria-label="Focus Timer">
        <h2>Focus Timer</h2>
        <div id="timer-display" class="timer-display" aria-live="polite">25:00</div>
        <div class="timer-controls">
          <button id="timer-start" type="button" class="btn btn-primary">Start</button>
          <button id="timer-stop"  type="button" class="btn">Stop</button>
          <button id="timer-reset" type="button" class="btn">Reset</button>
        </div>
        <!-- Custom duration row -->
        <div class="timer-duration-row">
          <label for="timer-duration-input" class="duration-label">Minutes:</label>
          <input
            id="timer-duration-input"
            type="number"
            class="duration-input"
            min="1"
            max="120"
            value="25"
            aria-label="Set timer duration in minutes"
          />
          <button id="timer-set-btn" type="button" class="btn btn-set">Set</button>
        </div>
      </section>

      <!-- To-Do List Section -->
      <section class="card todo-card" aria-label="To-Do List">
        <h2>To-Do List</h2>
        <form id="todo-form" class="todo-form">
          <input
            id="todo-input"
            type="text"
            placeholder="Add a new task..."
            aria-label="Add a new task"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <!-- Duplicate warning, hidden by default -->
        <p id="todo-duplicate-warn" class="warn-hint" aria-live="polite" hidden>
          ⚠ That task already exists.
        </p>
        <!-- Sort controls -->
        <div class="todo-sort" role="group" aria-label="Sort tasks">
          <span class="sort-label">Sort:</span>
          <button type="button" class="sort-btn active" data-sort="default" aria-pressed="true">Default</button>
          <button type="button" class="sort-btn" data-sort="active" aria-pressed="false">Active first</button>
          <button type="button" class="sort-btn" data-sort="done" aria-pressed="false">Done first</button>
        </div>
        <ul id="todo-list" class="todo-list"></ul>
        <p id="todo-empty" class="empty-hint">No tasks yet. Add one above.</p>
      </section>

      <!-- Quick Links Section -->
      <section class="card links-card" aria-label="Quick Links">
        <h2>Quick Links</h2>
        <form id="link-form" class="link-form">
          <input
            id="link-name"
            type="text"
            placeholder="Name (e.g. GitHub)"
            aria-label="Link name"
            autocomplete="off"
          />
          <input
            id="link-url"
            type="url"
            placeholder="https://..."
            aria-label="Link URL"
            autocomplete="off"
          />
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <div id="links-list" class="links-list"></div>
        <p id="links-empty" class="empty-hint">No quick links yet. Add one above.</p>
      </section>

    </div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
